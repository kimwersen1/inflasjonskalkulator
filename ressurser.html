<style>
nav{background:#114d2e;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:200}
.nav-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.2rem;color:#fff;text-decoration:none;letter-spacing:-0.02em}
.nav-logo span{color:#6ee09e}
.nav-links{display:flex;gap:0.25rem;list-style:none;margin:0;padding:0;align-items:center}
.nav-links>li>a{color:rgba(255,255,255,0.75);text-decoration:none;font-size:0.88rem;white-space:nowrap;padding:0.4rem 0.75rem;border-radius:6px;display:flex;align-items:center;gap:4px;transition:background 0.15s,color 0.15s}
.nav-links>li>a:hover{color:#fff;background:rgba(255,255,255,0.08)}
.nav-dd{position:relative}
.nav-dd>a .arr{font-size:0.6rem;transition:transform 0.2s;opacity:0.6}
.nav-dd:hover>a .arr{transform:rotate(180deg)}
.nav-drop{display:none;position:absolute;top:calc(100% + 6px);left:0;background:#0d3d22;border-radius:10px;padding:6px 0;min-width:230px;box-shadow:0 8px 28px rgba(0,0,0,0.35);z-index:300;border:1px solid rgba(255,255,255,0.08)}
.nav-dd:hover .nav-drop{display:block}
.nav-drop a{display:flex;align-items:center;gap:8px;padding:9px 16px;color:rgba(255,255,255,0.82);text-decoration:none;font-size:0.85rem;white-space:nowrap;transition:background 0.15s}
.nav-drop a:hover{background:rgba(255,255,255,0.07);color:#fff}
.nav-burger{display:none;flex-direction:column;justify-content:center;gap:5px;background:none;border:none;cursor:pointer;padding:8px;width:40px;height:40px}
.nav-burger span{display:block;width:22px;height:2px;background:#fff;border-radius:2px;transition:transform 0.25s,opacity 0.25s}
.nav-burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav-burger.open span:nth-child(2){opacity:0}
.nav-burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.nav-mobile{display:none;position:fixed;top:60px;left:0;right:0;bottom:0;background:#114d2e;z-index:199;overflow-y:auto;padding-bottom:2rem}
.nav-mobile.open{display:block}
.nav-section{font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.4);padding:1.25rem 1.5rem 0.5rem}
.nav-mobile a{display:block;color:rgba(255,255,255,0.85);text-decoration:none;padding:0.85rem 1.5rem;font-size:1rem;border-bottom:1px solid rgba(255,255,255,0.06)}
.nav-mobile a:hover{background:rgba(255,255,255,0.06);color:#fff}
@media(max-width:860px){.nav-links{display:none}.nav-burger{display:flex}}
@media(min-width:861px){.nav-mobile{display:none!important}.nav-burger{display:none}}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #1a7a4a; --green-light: #e8f5ee; --green-mid: #2a9d60;
  --green-dark: #114d2e; --text: #1a1a1a; --text-muted: #5a6472;
  --bg: #f7f8f5; --white: #ffffff; --border: #dde3d8;
  --font-head: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
  --radius: 12px; --radius-sm: 8px;
}
body { font-family: var(--font-body); background: var(--bg); color: var(--text); font-size: 17px; line-height: 1.7; }


.hero { background: var(--green-dark); padding: 3.5rem 1.5rem 4rem; }
.container { max-width: 860px; margin: 0 auto; padding: 0 1.5rem; }
.breadcrumb { font-size: 0.82rem; color: rgba(255,255,255,0.5); margin-bottom: 1rem; }
.breadcrumb a { color: rgba(255,255,255,0.6); text-decoration: none; }
.breadcrumb span { margin: 0 6px; }
.hero h1 { font-family: var(--font-head); font-weight: 800; font-size: clamp(1.35rem, 3.2vw, 3rem); color: #fff; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 0.75rem; word-break: break-word; word-break: break-word; }
.hero p { color: rgba(255,255,255,0.65); font-size: 1rem; max-width: 580px; font-weight: 300; }

.main { padding: 3rem 0 4rem; }
.sec-title { font-family: var(--font-head); font-weight: 700; font-size: 1.3rem; color: var(--green-dark); margin: 2.5rem 0 1.25rem; letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.6rem; }
.sec-title::before { content: ''; display: block; width: 4px; height: 1.3rem; background: var(--green); border-radius: 2px; }

.res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
.res-card {
  background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1.25rem 1.5rem; text-decoration: none; color: inherit;
  transition: box-shadow 0.15s, transform 0.12s, border-color 0.15s;
  display: flex; flex-direction: column; gap: 0.4rem;
}
.res-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-2px); border-color: #b2dfc6; }
.res-name { font-family: var(--font-head); font-weight: 700; font-size: 1rem; color: var(--green-dark); display: flex; align-items: center; gap: 0.5rem; }
.res-name .ext { font-size: 0.7rem; color: var(--text-muted); font-family: var(--font-body); font-weight: 400; }
.res-desc { font-size: 0.88rem; color: var(--text-muted); line-height: 1.55; }
.res-tag { display: inline-block; background: var(--green-light); color: var(--green); font-size: 0.7rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 99px; margin-top: 4px; align-self: flex-start; }
.res-tag.blue { background: #e6f1fb; color: #185fa5; }
.res-tag.orange { background: #fff3e0; color: #c05c00; }
.res-tag.purple { background: #f3eeff; color: #6b3fa0; }

.intro-box { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem 2rem; margin-bottom: 2rem; font-size: 0.95rem; line-height: 1.7; }
.intro-box p { margin-bottom: 0.75rem; }
.intro-box p:last-child { margin-bottom: 0; }

.back-link { display: inline-flex; align-items: center; gap: 8px; background: var(--green); color: #fff; text-decoration: none; font-family: var(--font-head); font-weight: 700; font-size: 0.95rem; padding: 12px 22px; border-radius: var(--radius-sm); margin-top: 2rem; transition: background 0.15s; }
.back-link:hover { background: var(--green-mid); }

footer { background: var(--green-dark); color: rgba(255,255,255,0.6); padding: 2rem 1.5rem; text-align: center; font-size: 0.88rem; }
footer a { color: rgba(255,255,255,0.8); text-decoration: none; }
.footer-links { display: flex; justify-content: center; gap: 2rem; margin-bottom: 0.75rem; flex-wrap: wrap; }

  .relatert-seksjon { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem 2rem; margin: 2rem 0; }
  .relatert-seksjon h2 { font-family: var(--font-head); font-weight: 700; font-size: 1.1rem; color: var(--green-dark); margin-bottom: 1rem; letter-spacing: -0.02em; }
  .relatert-lenker { display: flex; flex-wrap: wrap; gap: 0.75rem; }
  .relatert-lenke { background: var(--green-light); color: var(--green-dark); text-decoration: none; font-weight: 500; font-size: 0.88rem; padding: 8px 16px; border-radius: 99px; border: 1px solid #b2dfc6; transition: background 0.15s; white-space: nowrap; }
  .relatert-lenke:hover { background: #c8ecd8; }


</style>
