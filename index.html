<style>
nav{background:#114d2e;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:200}
.nav-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.2rem;color:#fff;text-decoration:none;letter-spacing:-0.02em}
.nav-logo span{color:#6ee09e}
.nav-links{display:flex;gap:1.5rem;list-style:none;align-items:center;margin:0;padding:0}
.nav-links>li>a{color:rgba(255,255,255,0.75);text-decoration:none;font-size:0.88rem;white-space:nowrap;display:flex;align-items:center;gap:3px;padding:4px 0}
.nav-links>li>a:hover{color:#fff}
.nav-dropdown{position:relative}
.nav-drop{display:none;position:absolute;top:calc(100% + 8px);left:-8px;background:#0c3520;border-radius:10px;padding:6px 0;min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,0.35);z-index:300;border:1px solid rgba(255,255,255,0.08)}
.nav-dropdown:hover .nav-drop{display:block}
.nav-drop a{display:block;padding:9px 16px;color:rgba(255,255,255,0.82);text-decoration:none;font-size:0.85rem;white-space:nowrap}
.nav-drop a:hover{background:rgba(255,255,255,0.07);color:#fff}
.nav-burger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px}
.nav-burger span{display:block;width:22px;height:2px;background:#fff;border-radius:2px}
.nav-mobile{display:none;position:fixed;top:60px;left:0;right:0;bottom:0;background:#114d2e;z-index:199;overflow-y:auto}
.nav-mobile.open{display:block}
.nav-mobile a{display:block;color:rgba(255,255,255,0.85);text-decoration:none;padding:14px 20px;font-size:1rem;border-bottom:1px solid rgba(255,255,255,0.07)}
.nav-mobile a:hover{background:rgba(255,255,255,0.06)}
.nav-section{font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.35);padding:14px 20px 6px}
@media(max-width:900px){.nav-links{display:none}}
@media(min-width:901px){.nav-burger{display:none}}
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #1a7a4a;
    --green-light: #e8f5ee;
    --green-mid: #2a9d60;
    --green-dark: #114d2e;
    --red: #c0392b;
    --red-light: #fdf0ee;
    --text: #1a1a1a;
    --text-muted: #5a6472;
    --bg: #f7f8f5;
    --white: #ffffff;
    --border: #dde3d8;
    --card-shadow: 0 1px 3px rgba(0,0,0,0.07);
    --font-head: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.7;
  }/* HERO */
  .hero {
    background: var(--green-dark);
    padding: 4rem 1.5rem 5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 60% 0%, rgba(46,160,90,0.25) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-tag {
    display: inline-block;
    background: rgba(110,224,158,0.15);
    border: 1px solid rgba(110,224,158,0.3);
    color: #6ee09e;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 99px;
    margin-bottom: 1.5rem;
  }
  .hero h1 {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: clamp(1.35rem, 3.2vw, 2.3rem);
    color: #fff;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 1rem;
    word-break: break-word;
  }
  .hero h1 span { color: #6ee09e; }
  .hero p {
    color: rgba(255,255,255,0.72);
    font-size: 1.1rem;
    max-width: 560px;
    margin: 0 auto;
    font-weight: 300;
  }

  /* MAIN LAYOUT */
  .container { max-width: 900px; margin: 0 auto; padding: 0 1.5rem; }
  .section { padding: 3.5rem 0; }

  /* CARD */
  .card {
    background: var(--white);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--card-shadow);
    padding: 2rem;
    margin-bottom: 1.5rem;
  }

  /* KATEGORI-TABS */
  .kat-tabs {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 0.75rem;
  }
  .kat-tab {
    padding: 7px 14px; border-radius: 99px;
    border: 1.5px solid var(--border);
    background: var(--bg); color: var(--text-muted);
    font-family: var(--font-body); font-size: 0.85rem; font-weight: 500;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .kat-tab:hover { border-color: var(--green-mid); color: var(--green); }
  .kat-tab.active {
    background: var(--green); border-color: var(--green);
    color: #fff;
  }
  .kat-desc {
    font-size: 0.82rem; color: var(--text-muted);
    margin-bottom: 1.25rem; min-height: 1.4em;
  }

  /* KALKULATOR */
  .kalk-wrap {
    margin-top: -2.5rem;
    position: relative;
    z-index: 10;
  }
  .kalk-card {
    background: var(--white);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    padding: 2.5rem;
  }
  .kalk-title {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 1.4rem;
    color: var(--green-dark);
    margin-bottom: 1.75rem;
    letter-spacing: -0.02em;
  }
  .kalk-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1.25rem;
    margin-bottom: 1.5rem;
  }
  @media (max-width: 640px) {
    .kalk-grid { grid-template-columns: 1fr; }
  }
  .field label {
    display: block;
    font-size: 0.8rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }
  .field input, .field select {
    width: 100%;
    height: 48px;
    padding: 0 1rem;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: var(--font-body);
    font-size: 1rem;
    color: var(--text);
    background: var(--bg);
    transition: border-color 0.15s, background 0.15s;
    outline: none;
    -moz-appearance: textfield;
  }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .field input:focus, .field select:focus {
    border-color: var(--green-mid);
    background: #fff;
  }
  .kalk-btn {
    width: 100%;
    height: 52px;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .kalk-btn:hover { background: var(--green-mid); }
  .kalk-btn:active { transform: scale(0.99); }

  .result-box {
    display: none;
    margin-top: 1.5rem;
    background: var(--green-light);
    border: 1.5px solid #b2dfc6;
    border-radius: var(--radius-sm);
    padding: 1.5rem;
  }
  .result-box.show { display: block; }
  .result-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
  }
  @media (max-width: 640px) { .result-grid { grid-template-columns: 1fr 1fr; } }
  .result-item { text-align: center; }
  .result-item .val {
    font-family: var(--font-head);
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--green-dark);
    letter-spacing: -0.03em;
    display: block;
  }
  .result-item .lbl {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .result-item.highlight .val { color: var(--red); }

  /* SECTION TITLES */
  .sec-title {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    letter-spacing: -0.03em;
    color: var(--green-dark);
    margin-bottom: 0.5rem;
  }
  .sec-sub {
    color: var(--text-muted);
    font-size: 1rem;
    margin-bottom: 2rem;
    font-weight: 300;
  }

  /* KATEGORI-TABELL */
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
  }
  @media (max-width: 860px) { .cat-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px) { .cat-grid { grid-template-columns: 1fr; } }
  .cat-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.9rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .cat-icon {
    font-size: 1.35rem;
    line-height: 1;
    flex-shrink: 0;
    width: 26px;
    text-align: center;
  }
  .cat-info { flex: 1; min-width: 0; }
  .cat-name {
    font-weight: 500;
    font-size: 0.82rem;
    color: var(--text);
    margin-bottom: 1px;
    line-height: 1.3;
  }
  .cat-src { font-size: 0.68rem; color: var(--text-muted); }
  .cat-pct {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: -0.02em;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .cat-pct.pos { color: var(--green); }
  .cat-pct.neg { color: var(--red); }

  /* TEKST-SEKSJON */
  .prose h2 {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 1.4rem;
    color: var(--green-dark);
    margin: 2rem 0 0.75rem;
    letter-spacing: -0.02em;
  }
  .prose p { margin-bottom: 1rem; color: var(--text); }
  .prose ul { margin: 0.5rem 0 1rem 1.5rem; }
  .prose ul li { margin-bottom: 0.4rem; }

  /* FAQ */
  .faq-item {
    border-bottom: 1px solid var(--border);
    padding: 1.25rem 0;
  }
  .faq-item:last-child { border-bottom: none; }
  .faq-q {
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 1rem;
    color: var(--green-dark);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
  }
  .faq-q::after {
    content: '+';
    font-size: 1.4rem;
    font-weight: 300;
    color: var(--green-mid);
    flex-shrink: 0;
    transition: transform 0.2s;
  }
  .faq-item.open .faq-q::after { transform: rotate(45deg); }
  .faq-a {
    display: none;
    padding-top: 0.75rem;
    color: var(--text-muted);
    font-size: 0.95rem;
    line-height: 1.7;
  }
  .faq-item.open .faq-a { display: block; }

  /* BLOGG */
  .blog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 1.5rem;
  }
  .blog-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: box-shadow 0.15s, transform 0.15s;
    display: block;
  }
  .blog-card:hover {
    box-shadow: 0 6px 24px rgba(0,0,0,0.1);
    transform: translateY(-2px);
  }
  .blog-thumb {
    height: 10px;
    background: var(--green);
  }
  .blog-thumb.t2 { background: #e67e22; }
  .blog-thumb.t3 { background: #2980b9; }
  .blog-thumb.t4 { background: #8e44ad; }
  .blog-body { padding: 1.5rem; }
  .blog-tag {
    display: inline-block;
    background: var(--green-light);
    color: var(--green);
    font-size: 0.72rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 0.75rem;
  }
  .blog-card-title {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--green-dark);
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
    line-height: 1.3;
  }
  .blog-excerpt {
    font-size: 0.88rem;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* ARTIKKEL SIDE */
  .article-hero {
    background: var(--green-dark);
    padding: 3rem 1.5rem;
    color: #fff;
  }
  .article-hero h1 {
    font-family: var(--font-head);
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    max-width: 700px;
  }
  .article-content {
    max-width: 700px;
    margin: 3rem auto;
    padding: 0 1.5rem;
  }
  .article-content h2 {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--green-dark);
    margin: 2rem 0 0.75rem;
    letter-spacing: -0.02em;
  }
  .article-content p { margin-bottom: 1.25rem; }

  /* FOOTER */
  footer {
    background: var(--green-dark);
    color: rgba(255,255,255,0.6);
    padding: 2.5rem 1.5rem;
    text-align: center;
    font-size: 0.88rem;
    margin-top: 3rem;
  }
  footer a { color: rgba(255,255,255,0.8); text-decoration: none; }
  footer a:hover { color: #fff; }
  .footer-links { display: flex; justify-content: center; gap: 2rem; margin-bottom: 1rem; flex-wrap: wrap; }

  /* DIVIDER */
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0;
  }

  /* INFO BADGE */
  .ssb-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--green-light);
    border: 1px solid #b2dfc6;
    color: var(--green);
    font-size: 0.8rem;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 99px;
    margin-bottom: 1.5rem;
  }
  .ssb-badge::before {
    content: '✓';
    font-weight: 700;
  }

  /* HIGHLIGHTED BOX */
  .highlight-box {
    background: var(--green-light);
    border-left: 4px solid var(--green);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 1rem 1.5rem;
    margin: 1.5rem 0;
    font-size: 0.95rem;
  }

  /* KPI info bar */
  .kpi-bar {
    background: var(--green-dark);
    display: flex;
    justify-content: center;
    gap: 1rem 1.5rem;
    padding: 0.5rem 1rem;
    flex-wrap: wrap;
  }
  .kpi-bar-item {
    color: rgba(255,255,255,0.7);
    font-size: 0.78rem;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .kpi-bar-item strong { color: #fff; }
  .kpi-bar-item .arrow.up { color: #6ee09e; }
  .kpi-bar-item .arrow.down { color: #ff8080; }
  .kpi-bar-item.hide-mobile { display: flex; }
  @media (max-width: 640px) { .kpi-bar-item.hide-mobile { display: none; } }

</style>
