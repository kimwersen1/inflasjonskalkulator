<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#114d2e"/>
  
  <!-- Venstre tekst -->
  <text x="80" y="120" font-family="sans-serif" font-size="22" fill="rgba(255,255,255,0.45)" letter-spacing="3">INFLASJONSKALKULATOR.NO</text>
  <text x="80" y="230" font-family="sans-serif" font-size="82" font-weight="800" fill="#ffffff">Inflasjonskalkulator</text>
  <text x="80" y="320" font-family="sans-serif" font-size="82" font-weight="800" fill="#6ee09e">.no</text>
  <text x="80" y="410" font-family="sans-serif" font-size="28" fill="rgba(255,255,255,0.6)">Beregn kjøpekraft og prisvekst fra 1960</text>
  
  <!-- Høyre: enkel statistikk-boks -->
  <rect x="760" y="80" width="360" height="460" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="940" y="140" font-family="sans-serif" font-size="15" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="2">KPI JUNI 2026</text>
  <text x="940" y="240" font-family="sans-serif" font-size="100" font-weight="800" fill="#6ee09e" text-anchor="middle">+2,7%</text>
  <text x="940" y="295" font-family="sans-serif" font-size="16" fill="rgba(255,255,255,0.5)" text-anchor="middle">12-månedersvekst · SSB</text>
  
  <!-- Skillelinje -->
  <rect x="800" y="330" width="280" height="1" fill="rgba(255,255,255,0.1)"/>
  
  <text x="940" y="375" font-family="sans-serif" font-size="14" fill="rgba(255,255,255,0.4)" text-anchor="middle">Matvarer +2,1% · Husleie +3,2%</text>
  <text x="940" y="405" font-family="sans-serif" font-size="14" fill="rgba(255,255,255,0.4)" text-anchor="middle">Drivstoff +1,8% · Strøm −4,2%</text>
  
  <!-- Bunntekst -->
  <text x="80" y="570" font-family="sans-serif" font-size="18" fill="rgba(110,224,158,0.7)">✓ Gratis  ✓ Oppdatert med SSB-tall  ✓ Fra 1960 til i dag</text>
</svg>